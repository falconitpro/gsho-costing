# clamd для CRM (04 §8.2). Только внутренняя сеть compose: порт наружу не публикуется.
Foreground yes
User clamav
LogFile /var/log/clamav/clamd.log
LogFileMaxSize 10M
LogRotate yes
LogTime yes
DatabaseDirectory /var/lib/clamav
TCPSocket 3310
TCPAddr 0.0.0.0
# Лимиты: документы до 50 МБ, медиа до 300 МБ (core/files.py); превышение лимитов проверки — отказ, не «чисто»
StreamMaxLength 310M
MaxFileSize 310M
MaxScanSize 400M
MaxRecursion 10
MaxFiles 10000
MaxScanTime 120000
AlertExceedsMax yes
# Память (ВМ 3,8 ГБ без swap): при обновлении баз не держать в памяти две копии
ConcurrentDatabaseReload no
MaxThreads 4
MaxQueue 20
ReadTimeout 180
CommandReadTimeout 30
SelfCheck 3600
