# Обновление баз (04 §8.2). database.clamav.net отвечает 403 для российских адресов (проверено на стенде 11.11.2026),
# поэтому зеркала. Базы подписаны ClamAV, freshclam проверяет подпись — зеркало не может подменить базы, только задержать.
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
UpdateLogFile /var/log/clamav/freshclam.log
LogFileMaxSize 10M
LogRotate yes
LogTime yes
PrivateMirror https://packages.microsoft.com/clamav
PrivateMirror https://clamav-mirror.ru
ScriptedUpdates no
Checks 4
ConnectTimeout 30
ReceiveTimeout 600
NotifyClamd /etc/clamav/clamd.conf
