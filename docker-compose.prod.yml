# Тестовый/боевой стенд с HTTPS на домене: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Переменные (файл .env в корне): DOMAIN, POSTGRES_PASSWORD, ACME_EMAIL, BASIC_AUTH_USER, BASIC_AUTH_HASH
services:
  frontend:
    build:
      context: ./frontend
      args:              # registry.npmjs.org (Cloudflare) из РФ-облаков часто недоступен
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
    ports: !reset []     # наружу смотрит только Caddy
    expose: ["80"]
  backend:
    build:
      context: ./backend
      args:              # deb.debian.org из Yandex Cloud не отвечает — зеркало Яндекса
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://mirror.yandex.ru/debian}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    ports: !reset []
    expose: ["8000"]
    restart: unless-stopped
  db:
    restart: unless-stopped
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
      FALLBACK_HOST: ${FALLBACK_HOST:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy-tls:/etc/caddy/site-tls:ro
      - ./deploy/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]
volumes:
  caddy_data:
  caddy_config:
