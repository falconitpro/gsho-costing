name: CI
on: [push, pull_request]
permissions:
  contents: write
jobs:
  backend:
    # 24.04 — есть postgresql-client-16 под сервер postgres:16; ubuntu-latest (26.04) даёт только клиент 18 (D-031)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: gsho, POSTGRES_PASSWORD: gsho, POSTGRES_DB: gsho }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gsho" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gsho:gsho@localhost:5432/gsho
      APP_ENV: dev
      TZ: Europe/Moscow   # D-193: «сегодня» тестов = «сегодня» сервера (иначе после 21:00 UTC даты расходятся)
      AUTH_PROVIDER: dev
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /tmp/gsho-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt -c backend/constraints.txt
      - name: restic, shellcheck, pg_dump 16 — для тестов резервного копирования (docs/operations/03)
        # pg_dump/pg_restore той же версии, что сервер (postgres:16): клиент 17+ пишет в дамп SET transaction_timeout, которого нет в 16
        run: |
          # Зеркала Ubuntu с раннеров GitHub бывают недоступны (11.11.2026 не резолвились ни azure.archive, ни archive.ubuntu.com).
          # Поэтому apt — одна короткая попытка, а для недостающего — замены без apt (D-054):
          #   shellcheck — из PyPI (shellcheck-py), restic — официальный релиз с GitHub, pg_dump/pg_restore/psql 16 — из образа
          #   postgres:16, уже скачанного для сервиса БД (тот же major, что сервер; файлы /tmp и рабочего каталога доступны).
          timeout 240 sh -c 'sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update -q &&
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 install -y -q restic shellcheck postgresql-client-16' || echo "apt недоступен — замены"
          command -v shellcheck || pip install -q shellcheck-py
          if ! command -v restic; then
            curl -fsSL https://github.com/restic/restic/releases/download/v0.16.4/restic_0.16.4_linux_amd64.bz2 | bunzip2 > /tmp/restic
            sudo install -m 0755 /tmp/restic /usr/local/bin/restic
          fi
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo mkdir -p /usr/lib/postgresql/16/bin
            for t in pg_dump pg_restore psql createdb dropdb; do
              printf '#!/bin/sh\nexec docker run --rm -i --network host -u "$(id -u):$(id -g)" -v /tmp:/tmp -v "$HOME:$HOME" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSWORD -e PGPASSFILE -e PGOPTIONS postgres:16 %s "$@"\n' "$t" | sudo tee /usr/lib/postgresql/16/bin/$t >/dev/null
              sudo chmod 0755 /usr/lib/postgresql/16/bin/$t
            done
          fi
          restic version && shellcheck --version | head -2 && /usr/lib/postgresql/16/bin/pg_dump --version
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: выпущенные миграции не изменены (D-210)
        run: python3 scripts/ci/migrations_lock.py
      - name: pytest
        run: |
          set -o pipefail
          mkdir -p artifacts
          cd backend && python -m pytest -q -x --junitxml=../artifacts/backend-junit.xml 2>&1 | tee /tmp/pytest.txt
      - name: отчёт backend (JUnit) — сохраняется при любом исходе (D-158)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: backend-junit, path: artifacts/backend-junit.xml, if-no-files-found: warn, retention-days: 30 }
      - name: Publish failure report as commit comment
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          body = "## pytest (backend) — failure\n```\n" + open('/tmp/pytest.txt', errors='replace').read()[-60000:] + "\n```"
          subprocess.run(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
                          "-f", f"body={body}"], check=False)
          PY
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: сборка (tsc --noEmit + vite build) и линтер (D-210)
        run: |
          set -o pipefail
          mkdir -p artifacts
          cd frontend && npm install && npm run build 2>&1 | tee ../artifacts/frontend-build.log
          npm run lint 2>&1 | tee -a ../artifacts/frontend-build.log
      - name: журнал сборки frontend — сохраняется при любом исходе
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: frontend-build, path: artifacts/frontend-build.log, if-no-files-found: warn, retention-days: 30 }
      - name: храповик стилей (D-117) — встроенных стилей и цветов вне палитры не больше, чем было
        run: python3 scripts/ci/style_budget.py
      - name: без системных окон браузера (D-108) — только askConfirm / askPrompt / askAlert
        run: |
          if grep -rnP "(?<![\w.])(window\.)?(confirm|prompt|alert)\(" frontend/src --include=*.ts --include=*.tsx | grep -v "function confirm(" | grep -v "components/Dialogs.tsx"; then
            echo "Найдены window.confirm / prompt / alert — используйте askConfirm / askPrompt / askAlert из components/Dialogs" >&2; exit 1
          fi

  ui:
    # D-106: интерфейс по ролям в браузере — разделы меню и вкладки сделки без ошибок страницы, 5xx и 403
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: gsho, POSTGRES_PASSWORD: gsho, POSTGRES_DB: gsho }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gsho" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gsho:gsho@localhost:5432/gsho
      APP_ENV: dev
      TZ: Europe/Moscow   # D-193: «сегодня» тестов = «сегодня» сервера (иначе после 21:00 UTC даты расходятся)
      AUTH_PROVIDER: dev
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /tmp/gsho-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r backend/requirements.txt -c backend/constraints.txt playwright
      - run: cd frontend && npm install
      - name: backend и frontend
        run: |
          cd backend && python -m scripts.seed
          nohup uvicorn app.main:app --port 8000 > /tmp/backend.log 2>&1 &
          cd ../frontend && nohup npx vite --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/api/auth/providers >/dev/null && curl -sf localhost:5173/ >/dev/null && break; sleep 2; done
      - name: проверка интерфейса по ролям
        run: python3 scripts/e2e/ui_smoke.py http://localhost:5173 http://localhost:8000 "$(command -v google-chrome || command -v chromium)"
      - name: сквозные сценарии — цифры на экране и в КП (D-119)
        run: python3 scripts/e2e/scenarios.py http://localhost:5173 http://localhost:8000 "$(command -v google-chrome || command -v chromium)"
      - name: автоматическая приёмка «Пульт ЗГД и поручения» — 34 сценария, AUD-01…06, ширины (D-158)
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8000
          RUN_ID: ci-${{ github.run_id }}
        run: BROWSER_EXECUTABLE="$(command -v google-chrome || command -v chromium)" python3 scripts/acceptance/acceptance.py artifacts/acceptance
      - name: та же приёмка в «Новом виде» (переключатель, D-159)
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8000
          RUN_ID: ci-new-${{ github.run_id }}
          ACCEPT_UI: new
        run: BROWSER_EXECUTABLE="$(command -v google-chrome || command -v chromium)" python3 scripts/acceptance/acceptance.py artifacts/acceptance/new-ui
      - name: доступность и переполнение «Нового вида» — 1440 и 390 px (пакет H5, D-172)
        run: WIDTHS=1440,390 python3 scripts/e2e/a11y_sweep.py artifacts/acceptance/a11y http://localhost:5173 "$(command -v google-chrome || command -v chromium)"
      - name: журнал backend при ошибке
        if: failure()
        run: tail -100 /tmp/backend.log
      - name: отчёт приёмки и журналы — сохраняются при любом исходе
        if: always()
        run: mkdir -p artifacts/acceptance && cp /tmp/backend.log /tmp/frontend.log artifacts/acceptance/ 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: acceptance-report, path: artifacts/acceptance, if-no-files-found: warn, retention-days: 30 }

  verified:
    # D-158: отметка «проверено» — ветка verified указывает на последний коммит main, прошедший все проверки.
    # Рабочий сервер (deploy/production/update.sh) ставит только её; непроверенную версию — только явно, с причиной в журнале.
    needs: [backend, frontend, ui]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # D-204: несколько слияний подряд — отметки ставятся по очереди, а не одновременно (27.11 более старая версия перезаписала новую)
    concurrency: { group: verified-pointer, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: продвинуть verified на ${{ github.sha }}
        run: |
          for attempt in 1 2 3; do
            # свежее состояние verified прямо перед решением, а не снимок с момента checkout
            git fetch -q origin "+refs/heads/verified:refs/remotes/origin/verified" 2>/dev/null || true
            old=$(git rev-parse -q --verify origin/verified || true)
            if [ -n "$old" ] && ! git merge-base --is-ancestor "$old" "$GITHUB_SHA"; then
              echo "verified (${old:0:7}) не предок $GITHUB_SHA — более новая версия уже проверена, не откатываю"; exit 0
            fi
            # атомарно: запись только если verified не сдвинули с момента проверки
            if git push origin "$GITHUB_SHA:refs/heads/verified" --force-with-lease="refs/heads/verified:${old}"; then
              echo "verified → $(git rev-parse --short "$GITHUB_SHA")"; exit 0
            fi
            echo "verified сдвинули параллельно — проверяю заново ($attempt)"; sleep 5
          done
          exit 1
      # D-210: пакет доказательств версии — что проверено и чем (90 дней в артефактах прогона + сводка комментарием к коммиту)
      - uses: actions/download-artifact@v4
        with: { path: evidence-in }
        continue-on-error: true
      - name: пакет доказательств версии
        run: python3 scripts/ci/release_evidence.py evidence-in artifacts/evidence
      - uses: actions/upload-artifact@v4
        with: { name: "release-evidence-${{ github.sha }}", path: artifacts/evidence, retention-days: 90 }
      - name: сводка к коммиту
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -f body="$(cat artifacts/evidence/MANIFEST.md)" >/dev/null || true

  deploy:
    needs: [backend, frontend, ui]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Deploy to test stand (Yandex Cloud)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then echo "DEPLOY_HOST не задан — стенд обновится сам (deploy/autodeploy.sh на сервере)"; exit 0; fi
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 deploy@"$HOST" 'bash /opt/gsho-costing/deploy/deploy-remote.sh'
