name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: gsho, POSTGRES_PASSWORD: gsho, POSTGRES_DB: gsho }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gsho" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gsho:gsho@localhost:5432/gsho
      APP_ENV: dev
      AUTH_PROVIDER: dev
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /tmp/gsho-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm install && npm run build
