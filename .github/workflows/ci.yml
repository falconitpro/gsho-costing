name: CI
on: [push, pull_request]
permissions:
  contents: write
jobs:
  backend:
    # 24.04 — есть postgresql-client-16 под сервер postgres:16; ubuntu-latest (26.04) даёт только клиент 18 (D-031)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: gsho, POSTGRES_PASSWORD: gsho, POSTGRES_DB: gsho }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gsho" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gsho:gsho@localhost:5432/gsho
      APP_ENV: dev
      AUTH_PROVIDER: dev
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /tmp/gsho-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - name: restic, shellcheck, pg_dump 16 — для тестов резервного копирования (docs/operations/03)
        # pg_dump/pg_restore той же версии, что сервер (postgres:16): клиент 17+ пишет в дамп SET transaction_timeout, которого нет в 16
        run: |
          # Зеркала Ubuntu с раннеров GitHub бывают недоступны (11.11.2026 не резолвились ни azure.archive, ни archive.ubuntu.com).
          # Поэтому apt — одна короткая попытка, а для недостающего — замены без apt (D-054):
          #   shellcheck — из PyPI (shellcheck-py), restic — официальный релиз с GitHub, pg_dump/pg_restore/psql 16 — из образа
          #   postgres:16, уже скачанного для сервиса БД (тот же major, что сервер; файлы /tmp и рабочего каталога доступны).
          timeout 240 sh -c 'sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update -q &&
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 install -y -q restic shellcheck postgresql-client-16' || echo "apt недоступен — замены"
          command -v shellcheck || pip install -q shellcheck-py
          if ! command -v restic; then
            curl -fsSL https://github.com/restic/restic/releases/download/v0.16.4/restic_0.16.4_linux_amd64.bz2 | bunzip2 > /tmp/restic
            sudo install -m 0755 /tmp/restic /usr/local/bin/restic
          fi
          if [ ! -x /usr/lib/postgresql/16/bin/pg_dump ]; then
            sudo mkdir -p /usr/lib/postgresql/16/bin
            for t in pg_dump pg_restore psql createdb dropdb; do
              printf '#!/bin/sh\nexec docker run --rm -i --network host -u "$(id -u):$(id -g)" -v /tmp:/tmp -v "$HOME:$HOME" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$PWD" -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGPASSWORD -e PGPASSFILE -e PGOPTIONS postgres:16 %s "$@"\n' "$t" | sudo tee /usr/lib/postgresql/16/bin/$t >/dev/null
              sudo chmod 0755 /usr/lib/postgresql/16/bin/$t
            done
          fi
          restic version && shellcheck --version | head -2 && /usr/lib/postgresql/16/bin/pg_dump --version
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: pytest
        run: |
          set -o pipefail
          cd backend && python -m pytest -q -x 2>&1 | tee /tmp/pytest.txt
      - name: Publish failure report as commit comment
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          body = "## pytest (backend) — failure\n```\n" + open('/tmp/pytest.txt', errors='replace').read()[-60000:] + "\n```"
          subprocess.run(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
                          "-f", f"body={body}"], check=False)
          PY
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm install && npm run build

  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Deploy to test stand (Yandex Cloud)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then echo "DEPLOY_HOST не задан — стенд обновится сам (deploy/autodeploy.sh на сервере)"; exit 0; fi
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 deploy@"$HOST" 'bash /opt/gsho-costing/deploy/deploy-remote.sh'
