name: CI
on: [push, pull_request]
permissions:
  contents: write
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: gsho, POSTGRES_PASSWORD: gsho, POSTGRES_DB: gsho }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gsho" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gsho:gsho@localhost:5432/gsho
      APP_ENV: dev
      AUTH_PROVIDER: dev
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_ROOT: /tmp/gsho-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - name: pytest
        run: |
          set -o pipefail
          cd backend && python -m pytest -q -x 2>&1 | tee /tmp/pytest.txt
      - name: Publish failure report as commit comment
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 - <<'PY'
          import json, subprocess, os
          body = "## pytest (backend) — failure\n```\n" + open('/tmp/pytest.txt', errors='replace').read()[-60000:] + "\n```"
          subprocess.run(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/comments",
                          "-f", f"body={body}"], check=False)
          PY
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm install && npm run build

  deploy:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Deploy to test stand (Yandex Cloud)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then echo "DEPLOY_HOST не задан — деплой пропущен"; exit 0; fi
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 deploy@"$HOST" 'bash /opt/gsho-costing/deploy/deploy-remote.sh'
