server {
  listen 80;
  root /usr/share/nginx/html;
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; client_max_body_size 50m; }
  # файлы сборки с хешем в имени не меняются — кэшируются надолго
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # index.html браузер проверяет при каждом открытии — после обновления стенда сразу видна новая версия
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }
  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri /index.html;
  }
}
