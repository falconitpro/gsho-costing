<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Себестоимость ГШО — демо</title>
<style>
:root{--accent:#ff3131;--soft:#fff0f0;--ink:#000;--muted:#6b6b6b;--line:#e4e4e4;--bg:#fafafa;--ok:#2e9e5b;--warn:#e0a800;--bad:#d32f2f}
*{box-sizing:border-box}body{margin:0;font-family:"Intro",Arial,system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;background:#fff;border-bottom:3px solid var(--accent);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{font-weight:800;color:var(--accent)}nav a{margin-right:14px;text-decoration:none;color:#000;padding:6px 2px;border-bottom:2px solid transparent;cursor:pointer}nav a.active{border-color:var(--accent)}
.spacer{flex:1}main{padding:16px;max-width:1400px;margin:0 auto}h1{font-size:20px;margin:0 0 12px}h2{font-size:16px;margin:16px 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}.grid{display:grid;gap:14px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.kd{grid-template-columns:260px 1fr}
@media(max-width:900px){.c2,.c3,.kd{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--accent);color:#fff;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}tr.t td{font-weight:700;border-top:2px solid #000}
.btn{background:var(--accent);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600;font-family:inherit}.btn.s{background:#fff;color:#000;border:1px solid #000}.btn.g{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,select{font-family:inherit;font-size:14px;padding:7px 9px;border:1px solid #bbb;border-radius:6px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#eee}.badge.a{background:var(--soft);color:var(--accent)}.badge.ok{background:#e6f5ec;color:var(--ok)}.badge.bad{background:#fde7e7;color:var(--bad)}.badge.w{background:#fff6d6;color:#8a6d00}
.mi{font-size:28px;font-weight:800}.mi.ok{color:var(--ok)}.mi.w{color:var(--warn)}.mi.bad{color:var(--bad)}.muted{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}.tabs button{background:none;border:0;padding:8px 12px;cursor:pointer;font-family:inherit;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}.tabs button.active{border-color:var(--accent);font-weight:700}
.alert{padding:10px 12px;border-radius:6px;margin:8px 0}.alert.e{background:#fde7e7;color:var(--bad)}.alert.w{background:#fff6d6}.alert.i{background:#eef4ff}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto}.col{background:#f1f1f1;border-radius:8px;padding:8px;min-height:120px}.col h3{font-size:13px;margin:4px 0 8px}.deal{background:#fff;border-radius:6px;padding:8px;margin-bottom:8px;border-left:3px solid var(--accent)}
.kpi{display:flex;flex-direction:column}.kpi .v{font-size:20px;font-weight:700}.kpi .l{font-size:12px;color:var(--muted)}
pre{white-space:pre-wrap;font-size:12px;background:#f6f6f6;padding:10px;border-radius:6px}.md h1,.md h2,.md h3{margin:14px 0 6px}.md table{margin:8px 0}.md code{background:#f1f1f1;padding:1px 4px;border-radius:3px}
.hidden{display:none}.vsel{padding:8px;border-radius:6px;cursor:pointer;margin-bottom:4px}.vsel.on{background:var(--soft)}
</style>
</head>
<body>
<header>
  <span class="brand">BergHaus · Себестоимость ГШО</span>
  <nav id="nav"><a data-p="deals" class="active">Сделки</a><a data-p="board">Доска</a><a data-p="tasks">Мои задачи</a><a data-p="rfq">Шаблон RFQ</a><a data-p="docs">Документация</a></nav>
  <span class="spacer"></span>
  <label class="muted">Роль: <select id="role"><option value="manager">Менеджер по продажам</option><option value="logistician">Логист / декларант</option><option value="service_head">Руководитель сервиса</option><option value="cd" selected>Коммерческий директор</option><option value="fd">Финансовый директор</option><option value="gd">Генеральный директор</option></select></label>
</header>
<main id="main"></main>
<script src="demo-data.js"></script>
<script>
const D = window.DEMO, ST = {draft:"Черновик",logistics_calc:"На расчёте логистики",service_calc:"На расчёте сервиса",calc_ready:"Расчёт сформирован",cd_approval:"На утверждении КД",fd_visa:"На визе финдиректора",gd_visa:"На визе гендиректора",rework:"На доработке",approved:"Утверждено",kp_sent:"КП отправлено",won:"Выиграна",lost:"Проиграна",cancelled:"Отменена"};
const ITEMS=[[1,"factory_price","Цена завода (с опциями)"],[2,"domestic_logistics","Внутрикитайская логистика"],[3,"export_formalities","Экспортные формальности КНР"],[4,"intl_freight","Международная перевозка"],[5,"insurance","Страхование"],[6,"customs_duty","Таможенная пошлина"],[7,"import_vat","НДС при ввозе"],[8,"broker_util","Брокер, СВХ, утильсбор"],[9,"certification","Сертификация и разрешения"],[10,"rf_delivery","Доставка по РФ"],[11,"finance","Финансовые расходы"],[12,"service","Сервис до наработки"],[13,"warranty_reserve","Гарантийный резерв"],[14,"overhead","Накладные компании"]];
const SC=[["pessimistic","Пессимистичный"],["base","Базовый"],["optimistic","Оптимистичный"]];
const R=v=>v==null?"—":new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(v), P=v=>v==null?"—":v.toFixed(2).replace(".",",")+" %", DT=s=>s?new Date(s).toLocaleDateString("ru-RU"):"—";
let state={page:"deals",tab:"main",vid:"V1",ktab:"cost",deal:null,role:"cd"};
const role=()=>state.role, mgmt=()=>["cd","fd","gd"].includes(role());
const main=document.getElementById("main");
document.getElementById("role").onchange=e=>{state.role=e.target.value;state.tab="main";render()};
document.querySelectorAll("#nav a").forEach(a=>a.onclick=()=>{state.page=a.dataset.p;state.deal=null;document.querySelectorAll("#nav a").forEach(x=>x.classList.toggle("active",x===a));render()});
function render(){ main.innerHTML = state.deal?dealCard():({deals:dealsList,board:board,tasks:tasks,rfq:rfq,docs:docs})[state.page](); bind(); }
function bind(){ main.querySelectorAll("[data-open]").forEach(a=>a.onclick=e=>{e.preventDefault();state.deal=D.deal;state.tab="main";render()});
  main.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
  main.querySelectorAll("[data-ktab]").forEach(b=>b.onclick=()=>{state.ktab=b.dataset.ktab;render()});
  main.querySelectorAll("[data-vid]").forEach(b=>b.onclick=()=>{state.vid=b.dataset.vid;render()});
  main.querySelectorAll("[data-doc]").forEach(b=>b.onclick=()=>{state.doc=b.dataset.doc;render()});
  const back=main.querySelector("#back"); if(back) back.onclick=()=>{state.deal=null;render()};
  const demo=main.querySelector("#demoPrice"); if(demo) demo.onclick=()=>alert("В демо цена не пересчитывается — живой пересчёт делает API /price (сумма, наценка или целевая маржа). Полный стенд: docker compose up.");
}
function dealsList(){ const rows=[D.deal,...D.other_deals].map(d=>`<tr><td><a href="#" data-open>${d.number}</a></td><td>${d.client}</td><td>${d.site}</td><td><span class="badge a">${ST[d.status]}</span></td><td>${DT(d.kp_due)}</td></tr>`).join("");
  return `<h1>Сделки</h1><div class="alert i">Демонстрационная страница без сервера: данные тестовой сделки D-2026-0042 посчитаны реальным расчётным ядром проекта. Переключатель роли в шапке показывает, что видит каждая роль (серверная фильтрация полей). Открыть можно только D-2026-0042.</div><div class="card"><table><thead><tr><th>Номер</th><th>Клиент</th><th>Объект</th><th>Статус</th><th>Срок КП</th></tr></thead><tbody>${rows}</tbody></table></div>`; }
function board(){ const cols={}; [D.deal,...D.other_deals].forEach(d=>(cols[d.status]=cols[d.status]||[]).push(d));
  return `<h1>Доска сделок</h1><div class="board">${Object.keys(ST).filter(k=>cols[k]).map(k=>`<div class="col"><h3>${ST[k]} <span class="muted">(${cols[k].length})</span></h3>${cols[k].map(d=>`<div class="deal"><b>${d.number}</b><div class="muted">${d.client} · ${d.site}</div></div>`).join("")}</div>`).join("")}</div>`; }
function tasks(){ const t=role()==="cd"||role()==="gd"?D.deal.tasks:role()==="manager"?[{role:"Менеджер",title:"Отправить КП клиенту (D-2026-0041)",due:"2026-10-21",overdue:true}]:[]; return `<h1>Мои задачи</h1><div class="card"><table><thead><tr><th>Задача</th><th>Роль</th><th>Срок</th></tr></thead><tbody>${t.map(x=>`<tr><td>${x.title}</td><td>${x.role}</td><td>${DT(x.due)} ${x.overdue?'<span class="badge bad">просрочено</span>':''}</td></tr>`).join("")||'<tr><td colspan=3 class="muted">Задач нет</td></tr>'}</tbody></table></div>`; }
function rfq(){ return `<h1>Двуязычный шаблон RFQ (v1)</h1><p class="muted">Поля идентифицируются по коду; метка L — уходят логисту в карточку оборудования. Файл: samples/RFQ_шаблон_v1_пустой.xlsx</p><div class="card"><table><thead><tr><th>Код</th><th>Параметр (RU)</th><th>中文</th><th>Пример значения</th><th>Ед.</th><th>L</th></tr></thead><tbody>${D.rfq_rows.map(r=>`<tr><td>${r.code}</td><td>${r.ru}</td><td>${r.zh}</td><td>${r.value??'<span class="muted">—</span>'}</td><td>${r.unit}</td><td>${r.L?'L':''}</td></tr>`).join("")}</tbody></table></div>`; }
function md(s){ s=s.replace(/```mermaid[\s\S]*?```/g,"<pre class=\"muted\">[диаграмма mermaid — см. файл .md в docs/]</pre>").replace(/```[\s\S]*?```/g,m=>"<pre>"+m.replace(/```\w*\n?/g,"")+"</pre>");
  const lines=s.split("\n"),out=[];let tbl=[];const flush=()=>{if(tbl.length){const [h,,...b]=tbl;out.push("<table><thead><tr>"+h.split("|").slice(1,-1).map(c=>"<th>"+c.trim()+"</th>").join("")+"</tr></thead><tbody>"+b.map(r=>"<tr>"+r.split("|").slice(1,-1).map(c=>"<td>"+inl(c.trim())+"</td>").join("")+"</tr>").join("")+"</tbody></table>");tbl=[]}};
  const inl=t=>t.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\([^)]+\)/g,"$1");
  for(const l of lines){ if(l.startsWith("|")){tbl.push(l);continue} flush(); const m=l.match(/^(#+)\s+(.*)/); if(m) out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`); else if(l.startsWith("* ")||l.startsWith("- ")) out.push("<li>"+inl(l.slice(2))+"</li>"); else if(/^\d+\. /.test(l)) out.push("<li>"+inl(l.replace(/^\d+\. /,""))+"</li>"); else if(l.startsWith("<pre")||l.startsWith("</pre")) out.push(l); else if(l.trim()==="") out.push(""); else out.push("<p>"+inl(l)+"</p>"); } flush(); return out.join("\n"); }
function docs(){ const names=Object.keys(D.docs); state.doc=state.doc||names[0]; return `<h1>Документация</h1><div class="tabs">${names.map(n=>`<button data-doc="${n}" class="${n===state.doc?'active':''}">${n}</button>`).join("")}</div><div class="card md">${md(D.docs[state.doc])}</div>`; }
function dealCard(){ const d=D.deal, r=role(); const tabs=[["main","Шапка и условия"],["positions","Позиции и RFQ"]];
  if(["logistician","cd","fd","gd"].includes(r)) tabs.push(["logistics","Логистика и таможня"]); if(["service_head","cd","fd","gd"].includes(r)) tabs.push(["service","Сервис"]); if(mgmt()) tabs.push(["pricing","Расчёт и утверждение"]); tabs.push(["feed","Лента"],["versions","Версии и файлы"]);
  if(!tabs.find(t=>t[0]===state.tab)) state.tab="main";
  return `<a href="#" id="back">← к списку</a><div class="row" style="justify-content:space-between"><div><h1 style="margin-bottom:2px">${d.number} · ${d.client}</h1><span class="badge a">${ST[d.status]}</span> <span class="muted">${d.site} · срок КП ${DT(d.kp_due)} · версия ${d.version}</span></div>${r==="manager"?'<button class="btn" disabled title="Сделка на расчёте">Отправить на расчёт</button>':''}</div>
  <div class="tabs">${tabs.map(t=>`<button data-tab="${t[0]}" class="${t[0]===state.tab?'active':''}">${t[1]}</button>`).join("")}</div>${({main:tMain,positions:tPos,logistics:tLog,service:tSvc,pricing:tKD,feed:tFeed,versions:tVer})[state.tab]()}`; }
function tMain(){ const d=D.deal, v=D.input.variants[0]; return `<div class="grid c2"><div class="card"><h2 style="margin-top:0">Шапка</h2><table><tr><td>Клиент</td><td>${d.client}</td></tr><tr><td>Контактное лицо</td><td>${d.contact}</td></tr><tr><td>Объект</td><td>${d.site}</td></tr><tr><td>Дата запроса</td><td>${DT(d.requested_at)}</td></tr><tr><td>Базовая валюта</td><td>${D.input.base_currency}</td></tr><tr><td>Сервис до наработки</td><td>да, 10 000 м·ч</td></tr><tr><td>Условия эксплуатации</td><td>−40…+35 °C, подземные работы</td></tr></table></div>
  <div class="card"><h2 style="margin-top:0">Условия оплаты клиента (вариант 1)</h2><table><thead><tr><th>№</th><th>Доля</th><th>Событие</th><th>Смещение, дн</th></tr></thead><tbody>${v.client_payments.map(l=>`<tr><td>${l.no}</td><td>${l.share_pct} %</td><td>${l.event}</td><td>${l.offset_days}</td></tr>`).join("")}</tbody></table><div class="row" style="margin-top:8px"><span class="muted">Типовая схема:</span><button class="btn g">30/70</button><button class="btn g">100 % предоплата</button><button class="btn g">20/70/10 с гарантией</button></div></div></div>`; }
function tPos(){ const d=D.deal; return `<div class="card"><h2 style="margin-top:0">Позиции</h2><table><thead><tr><th>Завод</th><th>Тип / модель</th><th class="n">Кол-во</th><th class="n">Цена за ед.</th><th>Валюта</th><th class="n">Опции</th><th class="n">Произв., дн</th><th>Справка по цене</th></tr></thead><tbody>${d.positions.map(p=>`<tr><td>${p.factory}</td><td>${p.type} <b>${p.model}</b></td><td class="n">${p.qty}</td><td class="n">${R(p.price)}</td><td>${p.cur}</td><td class="n">${R(p.options)}</td><td class="n">${p.prod}</td><td>${p.last_price?`посл. ${R(p.last_price)} (+${p.dev} %) <span class="badge ok">в пределах 10 %</span>`:'<span class="muted">нет истории</span>'}</td></tr>`).join("")}</tbody></table></div>
  <div class="card"><h2 style="margin-top:0">Импорт RFQ</h2><div class="row"><input type="file" disabled><button class="btn s" disabled>Предпросмотр</button><button class="btn" disabled>Импортировать</button><span class="muted">в демо недоступно — см. вкладку «Шаблон RFQ» и samples/</span></div></div>
  <div class="card"><h2 style="margin-top:0">Варианты</h2><ul>${d.variants.map(v=>`<li>${v.name}${mgmt()?` — цена ${R(D.result.variants[v.id].base.price_rub)} RUB`:''}</li>`).join("")}</ul></div>`; }
function tLog(){ const b=D.input.batches[0]; return `<div class="card"><h2 style="margin-top:0">Партии и консолидация</h2><table><thead><tr><th>Партия</th><th>Маршрут</th><th class="n">Трансп. ед.</th><th class="n">Транзит / оформл., дн</th><th>Межд. перевозка</th><th>Страховка</th><th class="n">Брокер и СВХ</th><th class="n">Доставка по РФ</th><th>Распределение</th></tr></thead><tbody><tr><td>${b.id}</td><td>${b.route}</td><td class="n">${b.transport_units}</td><td class="n">${b.transit_days} / ${b.customs_days}</td><td>${R(b.intl_freight.amount)} ${b.intl_freight.currency}</td><td>${b.insurance_pct} %</td><td class="n">${R(b.broker_rub)}</td><td class="n">${R(b.rf_delivery_rub)}</td><td>по стоимости</td></tr></tbody></table></div>
  ${D.input.positions.map(p=>`<div class="card"><h2 style="margin-top:0">${p.machine_type} ${p.model} × ${p.qty} <span class="muted">· техданные (L): масса ${R(p.weight_kg/p.qty)} кг, объём ${p.volume_m3/p.qty} м³</span></h2><div class="grid c3"><div>Внутрикитайская логистика: <b>${R(p.domestic_logistics.amount)} CNY</b> <span class="badge ok">история: ср. ${R(p.domestic_logistics.amount*0.93)}, +7 %</span></div><div>Экспортные формальности: <b>${R(p.export_formalities.amount)} CNY</b></div><div>ТН ВЭД: <b>${p.hs_code}</b> → пошлина ${p.duty_pct} %, НДС ${p.vat_pct} %, утильсбор, ТР ТС 010/2011, ПСМ</div><div>Утилизационный сбор: <b>${R(p.util_fee_rub)} RUB</b></div><div>Сертификация: <b>${R(p.certification_rub)} RUB</b></div></div></div>`).join("")}
  ${role()==="logistician"?'<button class="btn" disabled>Завершить блок логистики (уже завершён)</button>':''}`; }
function tSvc(){ const s=D.service; return `<div class="card"><div class="row" style="gap:20px"><div class="kpi"><span class="v">${R(s.labour_rub)}</span><span class="l">работы, RUB</span></div><div class="kpi"><span class="v">${R(s.visits_rub)}</span><span class="l">выезды, RUB</span></div><div class="kpi"><span class="v">${R(s.spare_parts_fx.amount)} CNY</span><span class="l">ЗИП</span></div><div class="kpi"><span class="v">${R(s.reserve_fx.amount)} CNY</span><span class="l">резерв на внеплановые</span></div><div class="kpi"><span class="v">${R(s.total_rub_part)} RUB + ${R(s.total_fx_part.amount)} CNY</span><span class="l">итого (статья 12)</span></div></div><div class="muted" style="margin-top:6px">Выполнений: ${Object.entries(s.executions).map(([k,v])=>k+" × "+v).join(", ")} · интенсивность 400 м·ч/мес · бригада 2 чел</div></div>
  <div class="card"><h2 style="margin-top:0">Сервис по периодам</h2><table><thead><tr><th>Месяц</th><th class="n">Наработка</th><th>Регламенты</th><th class="n">Чел·ч</th><th class="n">Работы, RUB</th><th class="n">Выезды</th><th class="n">Выезды, RUB</th><th class="n">ЗИП, CNY</th></tr></thead><tbody>${s.rows.filter(r=>r.regulations.length).map(r=>`<tr><td>${r.month}</td><td class="n">${r.hours_cum}</td><td>${r.regulations.join(", ")}</td><td class="n">${r.labour_hours}</td><td class="n">${R(r.labour_rub)}</td><td class="n">${r.visits}</td><td class="n">${R(r.visit_rub)}</td><td class="n">${R(r.spare_parts_fx)}</td></tr>`).join("")}</tbody></table></div>`; }
function chart(points){ if(!points.length)return""; const W=720,H=220,pad={l:70,r:10,t:10,b:28},w=W-pad.l-pad.r,h=H-pad.t-pad.b; const bals=points.map(p=>p.balance),fl=points.flatMap(p=>[p.inflow,-p.outflow]);const max=Math.max(0,...bals,...fl),min=Math.min(0,...bals,...fl);const y=v=>pad.t+(max-v)/(max-min||1)*h,x=i=>pad.l+i/Math.max(points.length-1,1)*w,bw=Math.max(2,w/points.length-2);
  const line=points.map((p,i)=>(i?"L":"M")+x(i)+","+y(p.balance)).join(" "),mi=bals.indexOf(Math.min(...bals));
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;font-size:11px">${[max,(max+min)/2,0,min].map(t=>`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(t)}" y2="${y(t)}" stroke="#e4e4e4"/><text x="${pad.l-6}" y="${y(t)+4}" text-anchor="end" fill="#6b6b6b">${(t/1e6).toFixed(1)} млн</text>`).join("")}
  ${points.map((p,i)=>`${p.inflow>0?`<rect x="${x(i)-bw/2}" y="${y(p.inflow)}" width="${bw}" height="${y(0)-y(p.inflow)}" fill="#2e9e5b" opacity=".5"/>`:""}${p.outflow>0?`<rect x="${x(i)-bw/2}" y="${y(0)}" width="${bw}" height="${y(-p.outflow)-y(0)}" fill="#ff3131" opacity=".4"/>`:""}`).join("")}
  <path d="${line} L${x(points.length-1)},${y(0)} L${x(0)},${y(0)} Z" fill="#ff3131" opacity=".08"/><path d="${line}" fill="none" stroke="#000" stroke-width="2"/><line x1="${pad.l}" x2="${W-pad.r}" y1="${y(0)}" y2="${y(0)}" stroke="#000"/>
  ${bals[mi]<0?`<circle cx="${x(mi)}" cy="${y(bals[mi])}" r="4" fill="#ff3131"/><text x="${Math.min(x(mi)+6,W-170)}" y="${y(bals[mi])-6}" fill="#ff3131" font-weight="700">разрыв ${(bals[mi]/1e6).toFixed(1)} млн</text>`:""}
  ${[0,Math.floor(points.length/2),points.length-1].map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" fill="#6b6b6b">${DT(points[i].on)}</text>`).join("")}</svg>`; }
function tKD(){ const v=D.result.variants[state.vid], b=v.base, thr=D.input.thresholds.margin_threshold_pct; const ind=b.margin_pct==null?["","цена не задана"]:v.pessimistic.margin_pct<0?["bad","отрицательная маржа в пессимистичном сценарии"]:b.margin_pct<thr?["w",`ниже порога ${thr} % — нужна виза ФД`]:["ok",`выше порога ${thr} %`]; const sn=b.sensitivity;
  const left=`<div class="card"><h2 style="margin-top:0">Варианты</h2>${D.deal.variants.map(x=>{const bb=D.result.variants[x.id].base;return `<div class="vsel ${x.id===state.vid?'on':''}" data-vid="${x.id}"><b>${x.name}</b><div class="muted">цена ${R(bb.price_rub)} · маржа ${P(bb.margin_pct)}</div></div>`}).join("")}</div>
  <div class="card"><h2 style="margin-top:0">Курс ЦБ на ${DT(D.input.fx.as_of)}</h2>${Object.entries(D.input.fx.rates).filter(([c])=>c!=="RUB").map(([c,r])=>`<div>${c}: <b>${r.toFixed(4)}</b></div>`).join("")}</div>
  ${D.result.approval.reasons.length||D.result.warnings.length?`<div class="card">${D.result.approval.reasons.map(r=>`<div class="alert w">${r}</div>`).join("")}${D.result.warnings.map(r=>`<div class="alert e">${r}</div>`).join("")}</div>`:""}`;
  const kt=state.ktab; let body="";
  if(kt==="cost") body=`<div class="card"><table><thead><tr><th>№</th><th>Статья</th>${SC.map(s=>`<th class="n">${s[1]}</th>`).join("")}</tr></thead><tbody>${ITEMS.map(([n,k,t])=>`<tr><td>${n}</td><td>${t}</td>${SC.map(s=>`<td class="n">${R(v[s[0]].items_rub[k])}</td>`).join("")}</tr>`).join("")}
    <tr class="t"><td></td><td>Себестоимость, RUB</td>${SC.map(s=>`<td class="n">${R(v[s[0]].cost_total_rub)}</td>`).join("")}</tr><tr><td></td><td>в CNY</td>${SC.map(s=>`<td class="n">${R(v[s[0]].cost_total_base_ccy)}</td>`).join("")}</tr><tr><td></td><td>Цена продажи без НДС</td>${SC.map(s=>`<td class="n">${R(v[s[0]].price_rub)}</td>`).join("")}</tr><tr><td></td><td><b>Маржа от выручки</b></td>${SC.map(s=>`<td class="n"><b>${P(v[s[0]].margin_pct)}</b></td>`).join("")}</tr><tr><td></td><td>Наценка (справочно)</td>${SC.map(s=>`<td class="n">${P(v[s[0]].markup_pct)}</td>`).join("")}</tr><tr><td></td><td>Прибыль, RUB</td>${SC.map(s=>`<td class="n">${R(v[s[0]].profit_rub)}</td>`).join("")}</tr><tr><td></td><td>Кассовый разрыв, RUB / дней</td>${SC.map(s=>`<td class="n">${R(v[s[0]].cash_gap.amount_rub)} / ${v[s[0]].cash_gap.days}</td>`).join("")}</tr><tr><td></td><td>Срок поставки от договора, дней</td>${SC.map(s=>`<td class="n">${v[s[0]].delivery_days}</td>`).join("")}</tr></tbody></table></div>`;
  else if(kt==="cf") body=`<div class="card">${SC.map(s=>{const r=v[s[0]];return `<h2>${s[1]}: ${r.cash_gap.amount_rub<0?`разрыв ${R(r.cash_gap.amount_rub)} RUB с ${DT(r.cash_gap.starts_on)}, ${r.cash_gap.days} дн`:"без разрыва"}</h2>${chart(r.cashflow)}`}).join("")}<div class="muted">Финансовые расходы (базовый): ${Object.entries(b.finance_breakdown).map(([k,x])=>k+" "+R(x)).join(" · ")}</div></div>`;
  else if(kt==="fx") body=`<div class="card" style="overflow-x:auto"><table><thead><tr><th>Платёж</th><th>Дата</th><th class="n">T</th><th class="n">K ЦБ</th><th class="n">A форвард</th><th class="n">Б тренд</th><th class="n">В сезон (min–max)</th><th>w A/Б/Г</th><th class="n">Прогноз</th><th class="n">ΔK ±, %</th><th class="n">пессим.</th><th class="n">оптим.</th></tr></thead><tbody>${D.result.fx_components.map(c=>`<tr><td>${c.payment_ref}</td><td>${DT(c.on)}</td><td class="n">${c.t_days}</td><td class="n">${c.k_cbr.toFixed(4)}</td><td class="n">${c.comp_a_forward.toFixed(4)}</td><td class="n">${c.comp_b_trend.toFixed(4)}</td><td class="n">${c.comp_c_season.toFixed(4)} (${c.season_spread[0].toFixed(3)}–${c.season_spread[1].toFixed(3)})</td><td>${c.weights.map(w=>w.toFixed(2)).join("/")}</td><td class="n"><b>${c.forecast.toFixed(4)}</b></td><td class="n">${c.dk_pct.pessimistic.toFixed(2)} / ${c.dk_pct.optimistic.toFixed(2)}</td><td class="n">${c.rate_by_scenario.pessimistic.toFixed(4)}</td><td class="n">${c.rate_by_scenario.optimistic.toFixed(4)}</td></tr>`).join("")}</tbody></table><p class="muted">Ключевая ставка 16 %, ставка НБК 3,1 %, история 3 года, веса A/Б×В/Г = 0,4/0,3/0,3 (прогноз ФД не задан → вес Г распределён на A и Б×В), ΔK — историческая волатильность × 1,0 / 0,6.</p></div>`;
  else body=`<div class="grid c2"><div class="card"><h2 style="margin-top:0">Комментарии логиста и менеджера</h2><div><span class="badge">логист</span> <b>intl_freight</b> (Партия 1): ставка перевозчика выросла после ввода новых экологических сборов на границе</div><div style="margin-top:6px"><span class="badge">менеджер</span> <b>цена завода</b> (XDR80T): +9,5 % к последней цене — в пределах порога 10 %</div></div><div class="card"><h2 style="margin-top:0">История цен заводов</h2><table><tr><td>XDR80T</td><td class="n">2 100 000 CNY</td><td>01.03.2026</td></tr><tr><td>XDR80T</td><td class="n">2 000 000 CNY</td><td>01.09.2025</td></tr></table><h2>История КП этому клиенту</h2><table><tr><td>D-2026-0039</td><td>ПДМ TG-1000, 1 шт</td><td class="n">41 500 000</td><td>выиграна</td></tr></table></div></div>`;
  const right=`<div class="card"><div class="row" style="justify-content:space-between"><div><div class="mi ${ind[0]}">${P(b.margin_pct)}</div><div class="muted">маржа от выручки (базовый) · ${ind[1]}</div><div class="muted">наценка ${P(b.markup_pct)} · прибыль ${R(b.profit_rub)} RUB · разрыв ${R(b.cash_gap.amount_rub)} RUB (${b.cash_gap.days} дн)</div></div>
    ${["cd","gd"].includes(role())?`<div class="row"><select><option>сумма, RUB без НДС</option><option>наценка, %</option><option>целевая маржа, %</option></select><input type="number" value="${b.price_rub}" style="width:160px"><button class="btn" id="demoPrice">Назначить цену</button></div>`:""}</div>
    ${sn?`<div class="muted" style="margin-top:6px">Чувствительность: курс +1 % → маржа ${sn.margin_delta_pct_per_1pct_fx.toFixed(2)} п.п. (${R(sn.margin_delta_rub_per_1pct_fx)} RUB); курс безубыточности по порогу: <b>${sn.breakeven_rate_base_ccy.toFixed(4)}</b> RUB/CNY</div>`:""}</div>
    <div class="tabs">${[["cost","Себестоимость 14 × 3"],["cf","Денежный поток"],["fx","Курсы и прогноз"],["hist","Комментарии и история"]].map(t=>`<button data-ktab="${t[0]}" class="${t[0]===kt?'active':''}">${t[1]}</button>`).join("")}</div>${body}
    <div class="card"><h2 style="margin-top:0">Действия</h2><div class="row">${["cd","gd"].includes(role())?`<button class="btn s">Показать сервис отдельной строкой в КП</button><button class="btn">Утвердить / отправить на визу</button><select><option>логист</option><option>менеджер</option><option>сервис</option></select><input placeholder="причина возврата" style="width:260px"><button class="btn g">Вернуть на доработку</button>`:role()==="fd"?`<input placeholder="комментарий к визе" style="width:300px"><button class="btn">Виза: согласовано</button><button class="btn g">Отказать</button>`:""}</div></div>`;
  return `<div class="grid kd"><div>${left}</div><div>${right}</div></div>`; }
function tFeed(){ return `<div class="card">${D.deal.feed.map(f=>`<div style="border-bottom:1px solid var(--line);padding:6px 0"><span class="badge">${f.kind}</span> <span class="muted">${f.at}</span><div>${f.text}</div></div>`).join("")}</div>`; }
function tVer(){ const m=mgmt(); return `<div class="card"><table><thead><tr><th>Версия</th><th>Причина</th><th>Дата</th><th>Excel-расчёт</th><th>КП</th></tr></thead><tbody><tr><td>v1</td><td>approval (пример)</td><td>31.10.2026</td><td>${m?'<a href="../samples/D-2026-0042_расчёт_v1_полный.xlsx">полный</a> · ':''}<a href="../samples/D-2026-0042_расчёт_v1_менеджер.xlsx">версия менеджера</a></td><td><a href="../samples/D-2026-0042_КП_пример.docx">КП.docx</a></td></tr></tbody></table><p class="muted">${m?"":"Полный Excel с себестоимостью для этой роли не выдаётся (папка «04 Расчёт себестоимости»)."}</p></div>`; }
